---
- name: Configure web servers
  hosts: webservers
  become: yes
  tasks:
    - name: Install Apache2
      apt:
        name: apache2
        state: present
        update_cache: yes

    - name: Deploy index.html
      copy:
        content: "<h1>Managed by Ansible: {{ inventory_hostname }}</h1>"
        dest: /var/www/html/index.html

    - name: Ensure Apache2 is running
      service:
        name: apache2
        state: started
        enabled: yes
